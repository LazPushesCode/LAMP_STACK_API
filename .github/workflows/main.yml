name: Lint Code Base
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Linters
        run: |
          npx htmlhint "public/*.html"
          npx stylelint "public/css/*.css"
          npx eslint "public/js/*.js"