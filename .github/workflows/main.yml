name: CI Pipeline

on:
  push:
    branches: [ "main", "testing-assignment" ]
  pull_request:
    branches: [ "main" ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Linters
        run: |
          npx htmlhint "public/*.html"
          npx stylelint "public/css/*.css"
          npx eslint "public/js/*.js"

      - name: Run Automated Tests
        run: npm test